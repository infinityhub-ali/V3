<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinity Hub V3</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

header{
  text-align:center;
  padding:20px;
  background:#111827;
}

.search-bar{
  text-align:center;
  padding:10px;
}

.search-bar input{
  padding:10px;
  width:70%;
  border-radius:10px;
  border:none;
}

.search-bar button{
  padding:10px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  cursor:pointer;
}

.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  transition:0.2s;
}

.card:hover{
  background:#334155;
  transform:scale(1.05);
}

.section{
  display:none;
  padding:20px;
}

.back{
  padding:8px 12px;
  background:red;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>

</head>

<body>

<header>
  <h1>Infinity Hub V3</h1>
</header>

<!-- SEARCH -->
<div class="search-bar">
  <input id="searchInput" placeholder="Search anything...">
  <button onclick="doSearch()">Search</button>
</div>

<!-- DASHBOARD -->
<div class="container">

  <div class="card" onclick="openSec('quick')">⚡ Quick Hub</div>
  <div class="card" onclick="openSec('learn')">🎓 Learn Zone</div>
  <div class="card" onclick="openSec('market')">📊 Market Zone</div>
  <div class="card" onclick="openSec('tools')">🧰 Tools</div>

  <div class="card" onclick="getWeather()">🌤️ Weather</div>
  <div class="card" onclick="getCrypto()">₿ Crypto</div>
  <div class="card" onclick="getNews()">📰 News</div>

</div>

<!-- ZONES -->
<div id="quick" class="section"><button class="back" onclick="goHome()">⬅ Back</button><h2>Quick Hub</h2></div>
<div id="learn" class="section"><button class="back" onclick="goHome()">⬅ Back</button><h2>Learn Zone</h2></div>
<div id="market" class="section"><button class="back" onclick="goHome()">⬅ Back</button><h2>Market Zone</h2></div>
<div id="tools" class="section"><button class="back" onclick="goHome()">⬅ Back</button><h2>Tools</h2></div>

<!-- OUTPUT -->
<div id="weatherBox" class="section"></div>
<div id="cryptoBox" class="section"></div>
<div id="newsBox" class="section"></div>
  <script>

function goHome(){
  document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
  document.querySelector('.container').style.display = 'grid';
}

function openSec(id){
  document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
  document.querySelector('.container').style.display = 'grid';
  document.getElementById(id).style.display = 'block';
}

function doSearch(){
  let q = document.getElementById("searchInput").value;
  if(!q) return alert("Type something");
  window.open("https://www.google.com/search?q=" + q, "_blank");
}

async function getWeather(){
  goHome();

  let res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=24.817&longitude=93.936&current_weather=true");
  let data = await res.json();

  document.getElementById("weatherBox").style.display = "block";
  document.getElementById("weatherBox").innerHTML =
    "<button class='back' onclick='goHome()'>⬅ Back</button>" +
    "<h2>🌤️ Weather</h2>" +
    "<p>Temp: " + data.current_weather.temperature + "°C</p>";
}

async function getCrypto(){
  goHome();

  let res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd");
  let data = await res.json();

  document.getElementById("cryptoBox").style.display = "block";
  document.getElementById("cryptoBox").innerHTML =
    "<button class='back' onclick='goHome()'>⬅ Back</button>" +
    "<h2>₿ Crypto</h2>" +
    "<p>BTC: $" + data.bitcoin.usd + "</p>" +
    "<p>ETH: $" + data.ethereum.usd + "</p>";
}

async function getNews(){
  goHome();

  document.getElementById("newsBox").style.display = "block";
  document.getElementById("newsBox").innerHTML =
    "<button class='back' onclick='goHome()'>⬅ Back</button><h2>📰 News</h2>" +
    "<p>Loading news...</p>";
}

</script>

</body>
</html>
