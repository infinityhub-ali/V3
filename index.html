<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinity Hub V3</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

header{
  text-align:center;
  padding:20px;
  background:#111827;
}

.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:12px;
  cursor:pointer;
  text-align:center;
  transition:0.2s;
}

.card:hover{
  background:#334155;
  transform:scale(1.05);
}

.section{
  display:none;
  padding:20px;
}

.back{
  padding:8px 12px;
  background:red;
  border:none;
  color:white;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:10px;
}
</style>
</head>

<body>

<header>
  <h1>Infinity Hub V3</h1>
  <p>Clean Dashboard System</p>
</header>

<div class="container">
  <div class="card" onclick="openSec('quick')">⚡ Quick Hub</div>
  <div class="card" onclick="getWeather()">
  🌤️ Live Weather
</div>

<div class="card" onclick="getCrypto()">
  ₿ Crypto Prices
</div>
  <div class="card" onclick="openSec('learn')">🎓 Learn Zone</div>
  <div class="card" onclick="openSec('market')">📊 Market Zone</div>
  <div class="card" onclick="openSec('tools')">🧰 Tools</div>
</div>

<div id="quick" class="section">
  <button class="back" onclick="goBack()">⬅ Back</button>
  <h2>Quick Hub</h2>
  <input placeholder="Search..." style="padding:10px;width:80%;">
</div>

<div id="learn" class="section">
  <button class="back" onclick="goBack()">⬅ Back</button>
  <h2>Learn Zone</h2>
  <p>Study tools + AI help (coming soon)</p>
</div>

<div id="market" class="section">
  <button class="back" onclick="goBack()">⬅ Back</button>
  <h2>Market Zone</h2>
  <p>Crypto + Stocks (coming soon)</p>
</div>

<div id="tools" class="section">
  <button class="back" onclick="goBack()">⬅ Back</button>
  <h2>Tools</h2>
  <p>Utility tools section</p>
</div>

<script>
function openSec(id){
  document.querySelectorAll('.section').forEach(s=>s.style.display='none');
  document.querySelector('.container').style.display='none';
  document.getElementById(id).style.display='block';
}

function goBack(){
  document.querySelectorAll('.section').forEach(s=>s.style.display='none');
  document.querySelector('.container').style.display='grid';
}
  <div id="weatherBox" class="section"></div>
<div id="cryptoBox" class="section"></div>
</script>

</body>
</html>
